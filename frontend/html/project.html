<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Board</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <nav class="navbar">
        <h2>Project Manager</h2>

        <div>
            <button onclick="goBack()">← Projects</button>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>


    <main class="board-container">

        <!-- Project information -->

        <div class="project-header">
            <div>
                <h1 id="projectName">Loading...</h1>
                <p id="projectDescription"></p>
            </div>

            <button id="showTaskFormBtn">
                + Add Task
            </button>
        </div>


        <!-- Add Task Form -->

        <div id="taskFormContainer" class="form-container hidden">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Task title"
                    required
                >

                <textarea
                    id="taskDescription"
                    placeholder="Task description"
                ></textarea>

                <select id="assignedTo">
                    <option value="">Assign to (optional)</option>
                </select>

                <button type="submit">
                    Create Task
                </button>

                <button
                    type="button"
                    id="cancelTaskBtn"
                >
                    Cancel
                </button>

            </form>

            <p id="taskMessage"></p>

        </div>


        <!-- Project Board -->

        <div class="board">

            <div class="board-column">
                <h2>To Do</h2>
                <div id="todoTasks"></div>
            </div>

            <div class="board-column">
                <h2>In Progress</h2>
                <div id="progressTasks"></div>
            </div>

            <div class="board-column">
                <h2>Done</h2>
                <div id="doneTasks"></div>
            </div>

        </div>

    </main>


    <script src="../js/project.js"></script>

</body>
</html>
